<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolZilla - Free Online Tools</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 12px;
      font-weight: bold;
      color: #2563eb;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ToolZilla</h1>
  <p>Simple Tools, Free for Everyone</p>
</header>

<div class="container">

  <div class="tools">

    <div class="card">
      <h2>Percentage Calculator</h2>
      <input id="percent" type="number" placeholder="Percentage">
      <input id="number" type="number" placeholder="Number">
      <button onclick="percentage()">Calculate</button>
      <div class="result" id="percentResult"></div>
    </div>

    <div class="card">
      <h2>Marks Calculator</h2>
      <input id="obtained" type="number" placeholder="Obtained Marks">
      <input id="total" type="number" placeholder="Total Marks">
      <button onclick="marks()">Calculate</button>
      <div class="result" id="marksResult"></div>
    </div>

    <div class="card">
      <h2>Discount Calculator</h2>
      <input id="price" type="number" placeholder="Original Price">
      <input id="discount" type="number" placeholder="Discount %">
      <button onclick="discount()">Calculate</button>
      <div class="result" id="discountResult"></div>
    </div>

    <div class="card">
      <h2>Age Calculator</h2>
      <input id="dob" type="date">
      <button onclick="age()">Calculate Age</button>
      <div class="result" id="ageResult"></div>
    </div>

    <div class="card">
      <h2>Fuel Cost Calculator</h2>
      <input id="distance" type="number" placeholder="Distance (km)">
      <input id="mileage" type="number" placeholder="Mileage (km/L)">
      <input id="fuelprice" type="number" placeholder="Fuel Price/L">
      <button onclick="fuel()">Calculate</button>
      <div class="result" id="fuelResult"></div>
    </div>

  </div>

</div>

<footer>
  © 2026 ToolZilla
</footer>

<script>

function percentage() {
  let p = Number(document.getElementById("percent").value);
  let n = Number(document.getElementById("number").value);

  document.getElementById("percentResult").innerText =
    "Result: " + (p * n / 100);
}

function marks() {
  let obtained = Number(document.getElementById("obtained").value);
  let total = Number(document.getElementById("total").value);

  if (total <= 0) {
    document.getElementById("marksResult").innerText = "Enter valid total marks.";
    return;
  }

  let percentage = (obtained / total) * 100;

  document.getElementById("marksResult").innerText =
    "Percentage: " + percentage.toFixed(2) + "%";
}

function discount() {
  let price = Number(document.getElementById("price").value);
  let d = Number(document.getElementById("discount").value);

  let saved = price * d / 100;
  let finalPrice = price - saved;

  document.getElementById("discountResult").innerText =
    "Final Price: " + finalPrice.toFixed(2);
}

function age() {
  let birth = new Date(document.getElementById("dob").value);
  let today = new Date();

  if (isNaN(birth)) {
    document.getElementById("ageResult").innerText =
      "Please select your date of birth.";
    return;
  }

  let years = today.getFullYear() - birth.getFullYear();

  let month = today.getMonth() - birth.getMonth();

  if (
    month < 0 ||
    (month === 0 && today.getDate() < birth.getDate())
  ) {
    years--;
  }

  document.getElementById("ageResult").innerText =
    "Your Age: " + years + " years";
}
